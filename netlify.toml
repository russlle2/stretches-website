[build]
  publish = "gmf-site"
  command = "npm run build"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  # CommonJS uses ZISI's dependency copying. Keep Sharp external if esbuild is
  # selected later; native binaries must come from the remote Linux install.
  external_node_modules = ["sharp"]
  # Bundle non-JS files referenced via fs.readFileSync at runtime so they ship
  # with every Lambda. zip-it-and-ship-it can't auto-discover dynamic paths.
  included_files = ["netlify/functions/_shared/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Retire legacy product pages that bypass the canonical product catalog.
[[redirects]]
  from = "/fake-smiles-heavyweight-tee.html"
  to = "/shop.html"
  status = 302
  force = true

[[redirects]]
  from = "/signature-dad-hat.html"
  to = "/shop.html"
  status = 302
  force = true

[[redirects]]
  from = "/loyalty-hoodie.html"
  to = "/shop.html"
  status = 302
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "Content-Type"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
